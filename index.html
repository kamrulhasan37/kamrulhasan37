<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>হিসাব – আমার আর্থিক খাতা</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#232A6B"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2FA;--card:#fff;--ink:#1B2142;--mut:#555B85;--line:#E3E5F3;--pri:#2B3190;--g:#14A37F;--r:#E5484D;--a:#E89A1C;--hero:#232A6B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12142B;--card:#1C2040;--ink:#ECEEFF;--mut:#9AA0C8;--line:#2B3060;--pri:#8E94F5;--g:#3ED1A8;--r:#FF7478;--a:#F5B54A;--hero:#2B3190}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Anek Bangla','Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#v{max-width:560px;margin:0 auto;padding:14px 14px 100px}
h2{font-size:20px;font-weight:700;margin:4px 0 12px}
small{color:var(--mut);font-size:13.5px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{color:#C9CCF5}.hero h1{font-size:34px;font-weight:700;line-height:1.2;margin:2px 0 12px}
.two{display:flex;gap:10px}.two>div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 10px}
.two b{display:block;font-size:15px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chip{flex:0 0 auto;min-width:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.chip b{display:block;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:10px}
.row+.row{border-top:1px dashed var(--line)}
.tot{font-weight:700;font-size:18px}
.it{display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.it>div{flex:1;min-width:0}.it b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
em{font-style:normal;font-weight:600}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:12px;font:inherit;font-size:14px;white-space:nowrap;color:var(--mut);cursor:pointer}
.seg .on{background:var(--pri);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;cursor:pointer}
nav .on{color:var(--pri);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:18px;border:0;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(43,49,144,.35);z-index:6;cursor:pointer}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:600;background:var(--pri);color:#fff;margin-top:12px;cursor:pointer}
.btn.del{background:none;color:var(--r)}
.sm{border:1px solid var(--line);background:none;color:var(--pri);border-radius:11px;padding:5px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.sm.x{color:var(--r)}
.ib{border:0;background:none;color:var(--mut);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:17px}
label{display:block;margin-top:12px;font-size:15px;color:var(--mut)}
input,select{width:100%;margin-top:4px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.er{color:var(--r);font-size:14px;min-height:6px}
.emp{text-align:center;color:var(--mut);padding:26px 10px}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;background:var(--line);color:var(--mut)}
[hidden]{display:none!important}
.lb{margin-top:10px;font-size:14px;color:var(--mut)}
.rg{display:flex;flex-wrap:nowrap;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none}.rg::-webkit-scrollbar{display:none}
.rd{position:relative;margin:0;color:var(--ink);font-size:14px;flex:1 0 auto}
.rd input{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0}
.rd span{display:block;text-align:center;white-space:nowrap;padding:8px 7px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer}
.rd span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;margin-right:4px;vertical-align:-1px;opacity:.6}
.rd input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.rd input:checked+span:before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 2px var(--pri);opacity:1}
.rd input:focus-visible+span{outline:2px solid var(--a);outline-offset:2px}
.two2{display:flex;gap:8px}
</style>
</head>
<body>
<div id="v"></div>
<button class="fab" id="fab" aria-label="নতুন যোগ করুন"></button>
<nav id="nav"></nav>
<script>
const I={home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',biz:'M3 7h18v13H3zM9 7V4h6v3',cal:'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4',more:'M5 12h.01M12 12h.01M19 12h.01',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',up:'M12 19V5M5 12l7-7 7 7',dn:'M12 5v14M19 12l-7 7-7-7'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${I[n]}"/></svg>`;
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('hisab1')||'null')}catch(e){}
S=S||{w:[{id:1,n:'ক্যাশ',b:0},{id:2,n:'বিকাশ',b:0},{id:3,n:'ব্যাংক',b:0}],t:[],ev:[],ln:[],sv:[],tr:[]};
const save=()=>{try{localStorage.setItem('hisab1',JSON.stringify(S))}catch(e){}window.onSave&&window.onSave()};
window.hs={get:()=>S,set:d=>{S=d;try{localStorage.setItem('hisab1',JSON.stringify(S))}catch(e){}render()}};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const fmt=n=>(n<0?'−':'')+(Math.round(Math.abs(n)*100)/100).toLocaleString('bn-BD')+' ৳';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const today=new Date().toISOString().slice(0,10);
const bal=w=>w.b+sum(S.t.filter(x=>x.w==w.id),x=>x.s*x.a);
const wn=id=>(S.w.find(w=>w.id==id)||{n:'—'}).n;
const wo=()=>S.w.map(w=>[w.id,esc(w.n)]);
const K={p:'ব্যক্তিগত',b:'ব্যবসায়িক',x:'দেনা-পাওনা/অন্যান্য'};
let tab='home',sub='ln',oe=null;

function sheet(ti,f,cb,dl){
  const o=document.createElement('div');o.className='ov';
  const fld=x=>{let c;
    if(x.t=='radio')c=`<div class="rg">${x.o.map(p=>`<label class="rd"><input type="radio" name="${x.k}" value="${esc(p[0])}"${p[0]==x.v?' checked':''}><span>${p[1]}</span></label>`).join('')}</div>`;
    else if(x.t=='select')c=`<select>${x.o.map(p=>`<option value="${esc(p[0])}"${p[0]==x.v?' selected':''}>${p[1]}</option>`).join('')}</select>`;
    else c=`<input type="${x.t||'text'}" ${x.t=='number'?'inputmode="decimal" step="any"':''} value="${esc(x.v)}">`;
    return `<div class="fl" data-k="${x.k}"${x.sh?` data-sh='${JSON.stringify(x.sh)}'`:''}><div class="lb">${x.l}</div>${c}</div>`};
  o.innerHTML=`<div class="sh"><div class="hd"><b>${ti}</b><button class="ib" aria-label="বন্ধ করুন">${ic('x')}</button></div>${f.map(fld).join('')}<p class="er"></p><button class="btn" id="ok">সংরক্ষণ করুন</button>${dl?'<button class="btn del" id="dl">মুছে ফেলুন</button>':''}</div>`;
  document.body.appendChild(o);
  o.onclick=e=>{if(e.target==o)o.remove()};o.querySelector('.ib').onclick=()=>o.remove();
  const D=k=>o.querySelector(`[data-k="${k}"]`);
  const get=()=>{const r={};f.forEach(x=>{const d=D(x.k);r[x.k]=x.t=='radio'?(d.querySelector('input:checked')||{value:''}).value:x.t=='number'?parseFloat(d.querySelector('input').value):d.querySelector('input,select').value});return r};
  const vis=()=>{const r=get();o.querySelectorAll('.fl[data-sh]').forEach(d=>{d.hidden=!Object.entries(JSON.parse(d.dataset.sh)).every(([k,v])=>v.includes(r[k]))})};
  o.addEventListener('change',vis);o.addEventListener('input',vis);vis();
  o.querySelector('#ok').onclick=()=>{const r=get();
    if(f.some(x=>x.req&&!D(x.k).hidden&&!(r[x.k]>0))){o.querySelector('.er').textContent='সঠিক পরিমাণ লিখুন';return}
    f.forEach(x=>{if(x.t=='number'&&isNaN(r[x.k]))r[x.k]=0});
    cb(r);o.remove();save();render()};
  if(dl)o.querySelector('#dl').onclick=()=>{dl();o.remove();save();render()};
}

function addLoan(q){const id=uid();S.ln.push({id,dir:q.dir,who:q.who,a:q.a,note:q.note,d:q.d});
  S.t.push({id:uid(),lid:id,o:1,s:q.dir=='g'?-1:1,a:q.a,w:q.w,kind:'x',note:(q.dir=='g'?'ধার দিলাম: ':'ধার নিলাম: ')+q.who,d:q.d})}

function txForm(t,pre){
  const ed=!!t,uq=a=>[...new Set(a)],pk=a=>a.length?[...a.map(n=>[n,esc(n)]),['','নতুন নাম']]:null;
  const F=[{k:'s',l:'ধরন',t:'radio',o:ed?[['in','আয়'],['out','খরচ']]:[['in','আয়'],['out','খরচ'],['loan','ধার'],['sav','সঞ্চয়'],['tr','ট্রানজিট']],v:ed?(t.s>0?'in':'out'):(pre||'out')}];
  if(!ed){
    F.push({k:'dir',l:'দেনা নাকি পাওনা',t:'radio',o:[['g','পাওনা (দিয়েছি)'],['t','দেনা (নিয়েছি)']],v:'g',sh:{s:['loan']}});
    F.push({k:'sd',l:'জমা নাকি তোলা',t:'radio',o:[['dep','জমা করলাম'],['wd','তুললাম']],v:'dep',sh:{s:['sav']}});
    F.push({k:'td',l:'ট্রানজিটের ধরন',t:'radio',o:[['in','টাকা এসেছে'],['out','হস্তান্তর করেছি']],v:'in',sh:{s:['tr']}});
    [['lp',uq(S.ln.map(l=>l.who.trim())),'loan'],['sp',S.sv.map(s=>s.n),'sav'],['tp',uq(S.tr.map(x=>x.who)),'tr']].forEach(([k,a,s])=>{const o=pk(a);if(o)F.push({k,l:'আগের নাম থেকে বেছে নিন',t:'radio',o,v:'',sh:{s:[s]}})});
    F.push({k:'nm',l:'নাম (নতুন হলে এখানে লিখুন) — ব্যক্তি/সংস্থা বা সঞ্চয়ের নাম',v:'',sh:{s:['loan','sav','tr']}});
  }
  F.push({k:'a',l:'পরিমাণ (৳)',t:'number',req:1,v:t?t.a:''},
    {k:'w',l:'কোন ওয়ালেট',t:'radio',o:wo(),v:t?t.w:S.w[0].id},
    {k:'kind',l:'ব্যক্তিগত নাকি ব্যবসায়িক',t:'radio',o:[['p','ব্যক্তিগত'],['b','ব্যবসায়িক']],v:t?t.kind:'p',sh:{s:['in','out']}},
    {k:'note',l:'বিবরণ',v:t?t.note:''},{k:'d',l:'তারিখ',t:'date',v:t?t.d:today});
  sheet(ed?'লেনদেন সম্পাদনা':'নতুন লেনদেন',F,r=>{
    const d=r.d||today,nm=(r.lp||r.sp||r.tp||r.nm||'').trim();
    if(ed||r.s=='in'||r.s=='out'){const n={id:t?t.id:uid(),s:r.s=='in'?1:-1,a:r.a,w:+r.w,kind:r.kind,note:r.note,d};if(t&&t.ev)n.ev=t.ev;if(t)S.t[S.t.indexOf(t)]=n;else S.t.push(n)}
    else if(r.s=='loan')addLoan({dir:r.dir,who:nm||'নামহীন',a:r.a,w:+r.w,note:r.note,d});
    else if(r.s=='sav'){const n=nm||'সঞ্চয়';let s=S.sv.find(x=>x.n==n);if(!s){s={id:uid(),n,a:0};S.sv.push(s)}const g=r.sd=='dep'?1:-1;s.a=Math.max(0,s.a+g*r.a);
      S.t.push({id:uid(),s:-g,a:r.a,w:+r.w,kind:'x',note:(g>0?'সঞ্চয়ে জমা: ':'সঞ্চয় থেকে তোলা: ')+n,d})}
    else{const n=nm||'নামহীন';let x=S.tr.find(y=>y.who==n);if(!x){x={id:uid(),who:n,a:0,lead:0};S.tr.push(x)}
      if(r.td=='in'){x.a+=r.a;S.t.push({id:uid(),trid:x.id,o:1,s:1,a:r.a,w:+r.w,kind:'x',note:'ট্রানজিট: '+n,d})}
      else S.t.push({id:uid(),trid:x.id,s:-1,a:r.a,w:+r.w,kind:'x',note:'ট্রানজিট হস্তান্তর: '+n,d})}
  },t&&(()=>{S.t=S.t.filter(x=>x!=t)}));
}
const editTx=id=>{const t=S.t.find(x=>x.id==id);if(t&&t.kind!='x'&&t.w&&!t.lead)txForm(t)};

function walletForm(w){
  sheet(w?'ওয়ালেট সম্পাদনা':'নতুন ওয়ালেট',[{k:'n',l:'নাম (যেমন: নগদ, ডাচ-বাংলা ব্যাংক)',v:w?w.n:''},{k:'b',l:'শুরুর ব্যালেন্স (৳)',t:'number',v:w?w.b:0}],
    r=>{if(w){w.n=r.n||w.n;w.b=r.b}else S.w.push({id:uid(),n:r.n||'ওয়ালেট',b:r.b})},
    w&&S.w.length>1&&(()=>{S.w=S.w.filter(x=>x!=w);S.t=S.t.filter(x=>x.w!=w.id)}));
}
const editW=id=>walletForm(S.w.find(w=>w.id==id));

function evForm(){sheet('নতুন ইভেন্ট',[{k:'n',l:'ইভেন্টের নাম (যেমন: কক্সবাজার ভ্রমণ)',v:''},{k:'bud',l:'আগাম বাজেট (না থাকলে ০ রাখুন)',t:'number',v:0}],r=>S.ev.push({id:uid(),n:r.n||'ইভেন্ট',bud:r.bud}))}
function evExp(e){sheet('ইভেন্টের খরচ',[{k:'note',l:'কী বাবদ খরচ',v:''},{k:'a',l:'পরিমাণ (৳)',t:'number',req:1,v:''},{k:'w',l:'কোন ওয়ালেট থেকে',t:'select',o:wo(),v:S.w[0].id}],
  r=>S.t.push({id:uid(),s:-1,a:r.a,w:+r.w,kind:'p',note:r.note||e.n,d:today,ev:e.id}))}

function lnForm(){sheet('ধার যোগ করুন',[{k:'dir',l:'ধরন',t:'select',o:[['g','আমি ধার দিয়েছি (পাওনা)'],['t','আমি ধার নিয়েছি (দেনা)']],v:'g'},{k:'who',l:'ব্যক্তি বা সংস্থার নাম',v:''},{k:'a',l:'পরিমাণ (৳)',t:'number',req:1,v:''},{k:'w',l:'কোন ওয়ালেট',t:'select',o:wo(),v:S.w[0].id},{k:'note',l:'কারণ',v:''},{k:'d',l:'তারিখ',t:'date',v:today}],
  r=>{const id=uid();S.ln.push({id,dir:r.dir,who:r.who||'নামহীন',a:r.a,note:r.note});S.t.push({id:uid(),lid:id,o:1,s:r.dir=='g'?-1:1,a:r.a,w:+r.w,kind:'x',note:(r.dir=='g'?'ধার দিলাম: ':'ধার নিলাম: ')+r.who,d:r.d||today})})}
function lnPay(l){sheet(l.dir=='g'?'ফেরত পেয়েছি':'পরিশোধ করেছি',[{k:'a',l:'পরিমাণ (৳)',t:'number',req:1,v:''},{k:'w',l:'কোন ওয়ালেট',t:'radio',o:wo(),v:S.w[0].id},{k:'d',l:'তারিখ',t:'date',v:today}],
  r=>S.t.push({id:uid(),lid:l.id,s:l.dir=='g'?1:-1,a:r.a,w:+r.w,kind:'x',note:(l.dir=='g'?'ফেরত পেলাম: ':'পরিশোধ: ')+l.who,d:r.d||today}))}
const paid=l=>sum(S.t.filter(x=>x.lid==l.id&&!x.o),x=>x.a);
const lnDel=id=>{S.ln=S.ln.filter(l=>l.id!=id);S.t=S.t.filter(x=>x.lid!=id);save();render()};

function svForm(){sheet('নতুন সঞ্চয়',[{k:'n',l:'কোথায় জমা (যেমন: ডিপিএস, এফডিআর)',v:''},{k:'a',l:'বর্তমান পরিমাণ (৳)',t:'number',v:0}],r=>S.sv.push({id:uid(),n:r.n||'সঞ্চয়',a:r.a}))}

      return `<div style="border-top:1px dashed var(--line);padding:10px 0"><div class="row" style="border:0;padding:0"><div><span class="tag">${l.dir=='g'?'পাওনা':'দেনা'}</span> <b>${fmt(l.a)}</b><br><small>${ld(l)}${l.note?' · '+esc(l.note):''}</small></div><em class="${l.dir=='g'?'g':'r'}">${r>0?fmt(r)+' বাকি':'পরিশোধ ✓'}</em></div>${py.map(x=>`<div class="row" style="border:0;padding:2px 0"><small>${x.d} · ${l.dir=='g'?'ফেরত':'পরিশোধ'} ${fmt(x.a)}</small><button class="ib" onclick="payDel(${x.id})" aria-label="মুছুন">${ic('x',16)}</button></div>`).join('')}<div class="row" style="border:0;padding:8px 0 0;justify-content:flex-start;gap:8px">${r>0?`<button class="sm" onclick="lnPay(S.ln.find(x=>x.id==${l.id}))">${l.dir=='g'?'ফেরত পেয়েছি':'পরিশোধ করেছি'}</button>`:''}<button class="sm" onclick="lnEdit(${l.id})">এডিট</button><button class="sm x" onclick="lnDel(${l.id})">মুছুন</button></div></div>`}).join('')+'</div>'}).join(''):'<div class="card emp">কোনো ধার নেই। + বাটনে চেপে ধার যোগ করুন।</div>'}
  if(sub=='sv')b=S.sv.length?S.sv.map(s=>`<div class="card"><div class="row"><b>${esc(s.n)}</b><em>${fmt(s.a)}</em></div><div class="row"><button class="sm" onclick="svAdj(S.sv.find(x=>x.id==${s.id}))">জমা / তোলা</button><button class="sm x" onclick="S.sv=S.sv.filter(x=>x.id!=${s.id});save();render()">মুছুন</button></div></div>`).join(''):'<div class="card emp">সঞ্চয় ওয়ালেট থেকে আলাদা থাকে, তাই ভুলে খরচ হয় না</div>';
  if(sub=='tr')b=S.tr.length?S.tr.map(x=>{const h=held(x);return `<div class="card"><div class="row"><b>${esc(x.who)}</b><em class="a">${h>0?fmt(h)+' দিতে হবে':'হস্তান্তর শেষ ✓'}</em></div><div class="row"><small>মোট এসেছে ${fmt(x.a)}</small><span></span></div><div class="row">${h>0?`<button class="sm" onclick="trOut(S.tr.find(y=>y.id==${x.id}))">হস্তান্তর</button><button class="sm" onclick="trProfit(S.tr.find(y=>y.id==${x.id}))">বাকিটা আমার আয়</button>`:'<span></span>'}<button class="sm x" onclick="trDel(${x.id})">মুছুন</button></div></div>`}).join(''):'<div class="card emp">অন্যের পাঠানো টাকা এখানে রাখুন। এটা আপনার আয় হিসেবে গোনা হবে না।</div>';
  return `<h2>আরও</h2>${acct()}${seg}${b}<button class="btn del" style="color:var(--pri)" onclick="backup()">ব্যাকআপ ও রিস্টোর</button>`}
};
const T=[['home','হোম','home'],['list','লেনদেন','list'],['biz','ব্যবসা','biz'],['ev','ইভেন্ট','cal'],['more','আরও','more']];
function render(){
  $('#v').innerHTML=V[tab]();
  $('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';oe=null;render();scrollTo(0,0)">${ic(t[2])}${t[1]}</button>`).join('');
  $('#fab').innerHTML=ic('plus',24);
}
$('#fab').onclick=()=>{if(tab=='ev'){oe?evExp(S.ev.find(x=>x.id==oe)):evForm()}else if(tab=='more'){txForm(null,sub=='ln'?'loan':sub=='sv'?'sav':'tr')}else txForm(null)};
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
<script type="module" src="sync.js"></script>
</body>
